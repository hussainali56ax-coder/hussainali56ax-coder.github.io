[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader-bot"
version = "0.1.0"
description = "Telegram-first, reusable cross-platform video downloader service using yt-dlp"
requires-python = ">=3.10"
dependencies = [
  "python-telegram-bot==22.0",
  "yt-dlp>=2025.1.15",
  "python-dotenv==1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
